spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://localhost:13306/inventory_db
    username: dawn
    password: dawn
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:19092

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 재고 서비스는 이벤트를 받기만 하고 내지 않아서 아웃박스 릴레이를 끈다
dawn:
  outbox:
    relay:
      enabled: false
