spring:
  application:
    name: fulfillment-batch
  # 요청과 주기 작업을 가상 스레드로 돌린다. 기본 스케줄러는 스레드 하나라, 오래 걸리는 배치가 릴레이와 지표 갱신을 막는다
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:13306/fulfillment_db
    username: dawn
    password: dawn
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    jdbc:
      initialize-schema: always
    # 잡은 스케줄러나 관리 API 가 마감 시각 파라미터로 시작한다. 기동할 때 저절로 돌지 않게 한다
    job:
      enabled: false
  kafka:
    bootstrap-servers: localhost:19092

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

dawn:
  order:
    base-url: http://localhost:8081
