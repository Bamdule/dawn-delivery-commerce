# 푸시와 PR 마다 전체 빌드와 테스트를 돌린다. 테스트는 Testcontainers 로 MySQL 과 Kafka 를 띄우므로 Docker 가 있는 러너를 쓴다.
# 몇 분씩 걸리는 실험(./gradlew experiment)은 돌리지 않는다 (docs/experiments)
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드와 테스트
        run: ./gradlew build --no-daemon
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test"
