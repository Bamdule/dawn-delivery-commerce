spring:
  application:
    name: fulfillment-batch
  datasource:
    url: jdbc:mysql://localhost:13306/fulfillment_db
    username: dawn
    password: dawn
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    jdbc:
      initialize-schema: always
    # 잡은 스케줄러나 관리 API 가 마감 시각 파라미터로 시작한다. 기동할 때 저절로 돌지 않게 한다
    job:
      enabled: false
  kafka:
    bootstrap-servers: localhost:19092

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

dawn:
  order:
    base-url: http://localhost:8081
