spring:
  application:
    name: inventory-service
  # 요청과 주기 작업을 가상 스레드로 돌린다. 기본 스케줄러는 스레드 하나라, 오래 걸리는 배치가 릴레이와 지표 갱신을 막는다
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:13306/inventory_db
    username: dawn
    password: dawn
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:19092

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# 재고 서비스는 이벤트를 받기만 하고 내지 않아 아웃박스 표가 없다. 릴레이, 지표, 관리 API 를 모두 끈다
dawn:
  outbox:
    enabled: false
    relay:
      enabled: false
